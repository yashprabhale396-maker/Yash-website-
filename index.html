<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yash | Professional Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
    font-family:Arial, sans-serif;
}

body{
    background:#07111f;
    color:white;
    line-height:1.6;
}

/* NAVBAR */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,17,31,0.95);
    border-bottom:1px solid #24344d;
}

nav{
    max-width:1100px;
    margin:auto;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#38bdf8;
}

nav ul{
    display:flex;
    list-style:none;
    gap:28px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:16px;
}

nav a:hover{
    color:#38bdf8;
}

/* HERO */
.hero{
    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;
    background:linear-gradient(135deg,#07111f,#102a56,#0b1730);
}

.hero h1{
    font-size:60px;
    margin-bottom:20px;
}

.hero h1 span{
    color:#38bdf8;
}

.hero p{
    font-size:21px;
    color:#cbd5e1;
    max-width:650px;
    margin:auto;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 28px;
    background:#38bdf8;
    color:#07111f;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    background:#7dd3fc;
}

/* SECTIONS */
section{
    max-width:1100px;
    margin:auto;
    padding:90px 20px;
}

.title{
    text-align:center;
    font-size:38px;
    margin-bottom:45px;
    color:#38bdf8;
}

/* ABOUT */
.about{
    text-align:center;
}

.about p{
    max-width:750px;
    margin:auto;
    color:#cbd5e1;
    font-size:18px;
}

/* SKILLS */
.skills{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.skill{
    background:#101f35;
    padding:30px 20px;
    text-align:center;
    border:1px solid #263b58;
    border-radius:15px;
    transition:0.3s;
}

.skill:hover{
    transform:translateY(-8px);
    border-color:#38bdf8;
}

.skill h3{
    color:#38bdf8;
    margin-bottom:10px;
}

/* PROJECTS */
.projects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.project{
    background:#101f35;
    padding:30px;
    border-radius:15px;
    border:1px solid #263b58;
    transition:0.3s;
}

.project:hover{
    transform:translateY(-8px);
    border-color:#38bdf8;
}

.project h3{
    color:#38bdf8;
    margin-bottom:12px;
}

.project p{
    color:#cbd5e1;
}

/* CONTACT */
.contact{
    text-align:center;
}

.contact p{
    color:#cbd5e1;
    font-size:18px;
    margin:10px;
}

.contact a{
    color:#38bdf8;
    text-decoration:none;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px 20px;
    background:#050c16;
    color:#94a3b8;
    border-top:1px solid #243
