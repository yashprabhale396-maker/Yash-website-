<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yash | Professional Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      line-height: 1.6;
    }

    header {
      background: #111827;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #334155;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #38bdf8;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
    }

    .hero h1 {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #38bdf8;
    }

    .hero p {
      font-size: 20px;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    section {
      max-width: 1100px;
      margin: auto;
      padding: 80px 25px;
    }

    .title {
      text-align: center;
      font-size: 35px;
      margin-bottom: 40px;
      color: #38bdf8;
    }

    .about {
      text-align: center;
      max-width: 750px;
      margin: auto;
      color: #cbd5e1;
      font-size: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #334155;
    }

    .card h3 {
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .card p {
      color: #cbd5e1;
    }

    .contact {
      text-align: center;
    }

    .contact p {
      color: #cbd5e1;
      margin: 10px;
    }

    footer {
      background: #020617;
      text-align: center;
      padding: 25px;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 38px;
      }

      nav a {
        margin-left: 8px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <div class="logo">YASH</div>

      <div>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </header>

  <section class="hero" id="home">
    <div>

      <p>
        Welcome to my professional website.
